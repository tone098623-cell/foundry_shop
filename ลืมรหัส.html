<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ลืมรหัสผ่าน - COTTO Foundry Shop</title>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; font-family: 'Sarabun', sans-serif; margin: 0; padding: 0; }
        body { background: #f4f6f9; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .auth-card { background: white; padding: 35px 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); width: 100%; max-width: 420px; border-top: 5px solid #26364d; }
        .auth-header { text-align: center; margin-bottom: 20px; }
        .auth-header h2 { color: #26364d; font-size: 22px; font-weight: 700; margin-bottom: 8px; }
        .auth-header p { color: #666; font-size: 13px; line-height: 1.5; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-size: 14px; font-weight: 600; color: #333; margin-bottom: 6px; }
        .form-group input { width: 100%; padding: 10px 12px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; outline: none; transition: border-color 0.2s; }
        .form-group input:focus { border-color: #26364d; }
        .btn-submit { width: 100%; background: #17a2b8; color: white; border: none; padding: 12px; border-radius: 6px; font-size: 16px; font-weight: 600; cursor: pointer; transition: background 0.2s; }
        .btn-submit:hover { background: #117a8b; }
        .auth-footer { text-align: center; margin-top: 20px; font-size: 14px; }
        .auth-footer a { color: #6c757d; text-decoration: none; font-weight: 600; }
        .auth-footer a:hover { color: #26364d; text-decoration: underline; }
    </style>
</head>

<body>

    <div class="auth-card">
        <div class="auth-header">
            <h2>🔑 ลืมรหัสผ่าน?</h2>
            <p>กรอกรหัสพนักงาน หรืออีเมลที่ลงทะเบียนไว้ ระบบจะส่งขั้นตอนการกู้คืนรหัสผ่านไปทางอีเมลของคุณ</p>
        </div>

        <form action="login.html" method="GET" onsubmit="alert('ระบบได้ส่งลิงก์ตั้งรหัสผ่านใหม่ไปยังอีเมลของคุณเรียบร้อยแล้ว');">
            <div class="form-group">
                <label for="resetInfo">📧 อีเมล หรือ รหัสพนักงาน</label>
                <input type="text" id="resetInfo" name="resetInfo" placeholder="เช่น example@scg.com หรือ 561234" required>
            </div>

            <button type="submit" class="btn-submit">📩 ส่งลิงก์ตั้งรหัสผ่านใหม่</button>
        </form>

        <div class="auth-footer">
            <a href="login.html">⬅️ กลับไปยังหน้าเข้าสู่ระบบ</a>
        </div>
    </div>

</body>

</html>
