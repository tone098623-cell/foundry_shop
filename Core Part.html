<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>จัดการข้อมูลชิ้นส่วน (Part Master)</title>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; font-family: 'Sarabun', sans-serif; }
        body { background: #f4f6f9; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 1200px; margin: 0 auto; }
        
        .card { 
            background: white; 
            padding: 20px; 
            border-radius: 12px; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.05); 
            margin-bottom: 20px; 
        }
        
        h2 { margin-top: 0; color: #26364d; border-bottom: 2px solid #26364d; padding-bottom: 8px; }

        .form-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); 
            gap: 12px; 
            margin-bottom: 15px; 
        }

        .form-group { display: flex; flex-direction: column; }
        label { font-weight: bold; margin-bottom: 5px; font-size: 14px; color: #26364d; }
        input { padding: 9px 12px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; }
        input:focus { border-color: #26364d; outline: none; }

        .btn-group { display: flex; gap: 10px; flex-wrap: wrap; }
        .btn { 
            border: none; 
            padding: 10px 18px; 
            border-radius: 6px; 
            cursor: pointer; 
            font-weight: bold; 
            font-size: 14px; 
            transition: 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        
        .btn-add { background: #2e7d32; color: white; }
        .btn-add:hover { background: #1b5e20; }
        
        .btn-excel { background: #107c41; color: white; }
        .btn-excel:hover { background: #0b582e; }

        .btn-cancel { background: #757575; color: white; display: none; }
        .btn-cancel:hover { background: #616161; }

        /* Excel Paste Area */
        .excel-box {
            display: none;
            background: #f0fdf4;
            border: 2px dashed #107c41;
            padding: 15px;
            border-radius: 8px;
            margin-top: 15px;
        }
        .excel-box textarea {
            width: 100%;
            height: 120px;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-family: monospace;
            font-size: 13px;
            margin-bottom: 10px;
            resize: vertical;
        }
        .top-bar { display: flex; justify-content: space-between; margin-bottom: 15px; gap: 10px; flex-wrap: wrap; align-items: center; }

        .btn-link {
            background: #ffffff;
            color: #26364d;
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: bold;
            padding: 10px 18px;
            border-radius: 8px;
            border: 1px solid #dcdfe6;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            transition: all 0.2s;
        }
        .btn-link:hover { background: #26364d; color: #ffffff; }

        .card {
            background: white;
            border-radius: 10px;
            padding: 18px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.08);
            margin-bottom: 20px;
        }

        /* แถบควบคุมวันที่และปุ่มกด */
        .controls-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 15px;
            background: #f8fafc;
            padding: 12px 15px;
            border-radius: 8px;
            border: 1px solid #e2e8f0;
        }

        /* Table */
        .table-wrapper { overflow-x: auto; margin-top: 15px; }
        table { width: 100%; border-collapse: collapse; min-width: 600px; background: white; }
        th, td { border: 1px solid #e0e0e0; padding: 10px 12px; font-size: 14px; }
        th { background: #f8fafc; color: #26364d; font-weight: bold; text-align: left; }
        th.center, td.center { text-align: center; }
        th.right, td.right { text-align: right; }
        
        tr:hover { background-color: #f1f5f9; }

        .btn-sm { padding: 4px 8px; font-size: 12px; border-radius: 4px; border: none; cursor: pointer; font-weight: bold; }
        .btn-edit { background: #ffa000; color: white; margin-right: 4px; }
        .btn-edit:hover { background: #ff8f00; }
        .btn-del { background: #e53935; color: white; }
        .btn-del:hover { background: #c62828; }
        
        .note { font-size: 12px; color: #666; margin-bottom: 8px; }
    </style>
</head>
<body>
<div class="container">
    <div class="top-bar">
        <a href="Position.html" class="btn-link">⬅ ย้อนกลับ</a>
    </div>
<div class="container">
    <div class="card">
        <h2>📦 ระบบจัดการข้อมูลชิ้นส่วน (Part Master)</h2>

        <!-- ฟอร์มเพิ่ม/แก้ไขข้อมูลทีละแถว -->
        <form id="partForm">
            <div class="form-grid">
                <div class="form-group">
                    <label>Part:</label>
                    <input type="text" id="partCode" required placeholder="เช่น P-001">
                </div>
                <div class="form-group">
                    <label>Description:</label>
                    <input type="text" id="partDesc" required placeholder="เช่น Steel Plate A">
                </div>
                <div class="form-group">
                    <label>Plant:</label>
                    <input type="text" id="partPlant" required placeholder="เช่น Plant 1">
                </div>
                <div class="form-group">
                    <label>น้ำหนัก ( G ):</label>
                    <input type="number" step="0.01" id="partWeight" required placeholder="เช่น 150.50">
                </div>
            </div>

            <div class="btn-group">
                <button type="submit" id="btnSubmit" class="btn btn-add">➕ เพิ่มข้อมูลใหม่</button>
                <button type="button" id="btnCancel" class="btn btn-cancel" onclick="cancelEdit()">❌ ยกเลิกแก้ไข</button>
                <button type="button" class="btn btn-excel" onclick="toggleExcelBox()">📊 วางข้อมูลจาก Excel</button>
            </div>
        </form>

        <!-- กล่องสำหรับ Copy/Paste จาก Excel -->
        <div id="excelBox" class="excel-box">
            <label style="color: #107c41;">📋 วางข้อมูลที่ก๊อปปี้มาจาก Excel (เรียงคอลัมน์: Part | Description | Plant | น้ำหนัก)</label>
            <p class="note">* ก๊อปปี้เซลล์จาก Excel แล้วกด Ctrl+V วางในช่องด้านล่างได้เลย ระบบจะแยกคอลัมน์ให้อัตโนมัติ</p>
            <textarea id="excelInput" placeholder="ตัวอย่างการวาง:&#10;P001	Steel Plate	Plant A	250&#10;P002	Rubber Ring	Plant B	12.5"></textarea>
            <button type="button" class="btn btn-excel" onclick="importExcelData()">💾 นำเข้าข้อมูลเข้าตาราง</button>
        </div>
    </div>

    <!-- ตารางแสดงข้อมูล -->
    <div class="card">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <h3 style="margin: 0; color: #26364d;">ตารางรายการชิ้นส่วน</h3>
            <button class="btn btn-del" style="padding: 6px 12px; font-size: 12px;" onclick="clearAllData()">🗑️ ล้างข้อมูลทั้งหมด</button>
        </div>
        
        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th style="width: 50px;" class="center">ลำดับ</th>
                        <th>Part</th>
                        <th>Description</th>
                        <th>Plant</th>
                        <th class="right">น้ำหนัก ( G )</th>
                        <th style="width: 110px;" class="center">จัดการ</th>
                    </tr>
                </thead>
                <tbody id="dataTable">
                    <!-- ข้อมูลจะถูกโหลดใส่ที่นี่ -->
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
    let editIndex = -1;

    // โหลดข้อมูลจาก LocalStorage หรือตั้งค่าเริ่มต้น
    let partsData = JSON.parse(localStorage.getItem('parts_master_data')) || [
        { part: 'P-101', desc: 'Cover Front Body', plant: 'Plant 1', weight: 120.5 },
        { part: 'P-102', desc: 'Bracket Main Stand', plant: 'Plant 2', weight: 350.0 }
    ];

    // ฟังก์ชันแสดงผลตาราง
    function renderTable() {
        const tbody = document.getElementById('dataTable');
        
        if (partsData.length === 0) {
            tbody.innerHTML = `<tr><td colspan="6" class="center" style="color:#888; padding: 20px;">ไม่มีข้อมูลในระบบ</td></tr>`;
            return;
        }

        tbody.innerHTML = partsData.map((item, index) => `
            <tr>
                <td class="center">${index + 1}</td>
                <td><strong>${escapeHtml(item.part)}</strong></td>
                <td>${escapeHtml(item.desc)}</td>
                <td>${escapeHtml(item.plant)}</td>
                <td class="right">${parseFloat(item.weight).toLocaleString('th-TH', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}</td>
                <td class="center">
                    <button class="btn-sm btn-edit" onclick="editData(${index})">แก้ไข</button>
                    <button class="btn-sm btn-del" onclick="deleteData(${index})">ลบ</button>
                </td>
            </tr>
        `).join('');

        // บันทึกลง LocalStorage
        localStorage.setItem('parts_master_data', JSON.stringify(partsData));
    }

    // ฟังก์ชันป้องกัน XSS
    function escapeHtml(text) {
        if (!text) return '';
        return text.toString().replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }

    // บันทึก หรือ อัปเดตข้อมูล single row
    document.getElementById('partForm').onsubmit = function(e) {
        e.preventDefault();
        
        const newData = {
            part: document.getElementById('partCode').value.trim(),
            desc: document.getElementById('partDesc').value.trim(),
            plant: document.getElementById('partPlant').value.trim(),
            weight: parseFloat(document.getElementById('partWeight').value) || 0
        };

        if (editIndex === -1) {
            partsData.push(newData);
        } else {
            partsData[editIndex] = newData;
            cancelEdit();
        }

        this.reset();
        renderTable();
    };

    // เข้าสู่โหมดแก้ไขข้อมูล
    function editData(index) {
        editIndex = index;
        const item = partsData[index];

        document.getElementById('partCode').value = item.part;
        document.getElementById('partDesc').value = item.desc;
        document.getElementById('partPlant').value = item.plant;
        document.getElementById('partWeight').value = item.weight;

        const btnSubmit = document.getElementById('btnSubmit');
        btnSubmit.textContent = '💾 อัปเดตข้อมูล';
        btnSubmit.style.backgroundColor = '#1976d2';
        document.getElementById('btnCancel').style.display = 'inline-flex';

        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // ยกเลิกการแก้ไข
    function cancelEdit() {
        editIndex = -1;
        document.getElementById('partForm').reset();
        
        const btnSubmit = document.getElementById('btnSubmit');
        btnSubmit.textContent = '➕ เพิ่มข้อมูลใหม่';
        btnSubmit.style.backgroundColor = '#2e7d32';
        document.getElementById('btnCancel').style.display = 'none';
    }

    // ลบข้อมูลทีละรายการ
    function deleteData(index) {
        if (confirm('คุณต้องการลบรายการนี้ใช่หรือไม่?')) {
            if (editIndex === index) cancelEdit();
            partsData.splice(index, 1);
            renderTable();
        }
    }

    // เปิด/ปิดกล่องวาง Excel
    function toggleExcelBox() {
        const box = document.getElementById('excelBox');
        box.style.display = (box.style.display === 'block') ? 'none' : 'block';
    }

    // นำเข้าข้อมูลจากการวาง (Paste) แถวของ Excel
    function importExcelData() {
        const text = document.getElementById('excelInput').value.trim();
        if (!text) {
            alert('กรุณาวางข้อมูลจาก Excel ในช่องก่อนกดนำเข้า');
            return;
        }

        const lines = text.split('\n');
        let importedCount = 0;

        lines.forEach(line => {
            if (!line.trim()) return;
            
            // แยกคอลัมน์ด้วย Tab (\t) ซึ่งเป็นรูปแบบมาตรฐานการ Copy จาก Excel
            const cols = line.split('\t');

            if (cols.length >= 1 && cols[0].trim() !== '') {
                partsData.push({
                    part: cols[0] ? cols[0].trim() : '',
                    desc: cols[1] ? cols[1].trim() : '',
                    plant: cols[2] ? cols[2].trim() : '',
                    weight: cols[3] ? (parseFloat(cols[3].replace(/,/g, '').trim()) || 0) : 0
                });
                importedCount++;
            }
        });

        if (importedCount > 0) {
            alert(`นำเข้าข้อมูลเรียบร้อยแล้วจำนวน ${importedCount} รายการ`);
            document.getElementById('excelInput').value = '';
            toggleExcelBox();
            renderTable();
        } else {
            alert('ไม่สามารถนำเข้าข้อมูลได้ กรุณาตรวจสอบรูปแบบข้อมูล');
        }
    }

    // ล้างข้อมูลทั้งหมด
    function clearAllData() {
        if (confirm('คำเตือน: คุณต้องการลบข้อมูลทั้งหมดในตารางใช่หรือไม่?')) {
            partsData = [];
            cancelEdit();
            renderTable();
        }
    }

    // แสดงผลครั้งแรก
    renderTable();
</script>

</body>
</html>
