<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ฐานข้อมูลการบันทึก OT</title>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600;700&display=swap" rel="stylesheet">
    <!-- ไลบรารีสำหรับ Export Excel -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

    <style>
        * { box-sizing: border-box; font-family: 'Sarabun', sans-serif; }
        body { background: #f4f6f9; margin: 0; padding: 20px; color: #222; }
        .container { max-width: 1400px; margin: 0 auto; }
        
        /* Top Navigation */
        .top-bar { display: flex; justify-content: space-between; margin-bottom: 20px; }

        /* Filter Panel */
        .filter-card {
            background: white;
            padding: 18px 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            align-items: flex-end;
            justify-content: space-between;
        }
        .filter-group { display: flex; flex-direction: column; gap: 5px; }
        .filter-group label { font-weight: bold; font-size: 14px; color: #444; }
        .filter-group input, .filter-group select {
            padding: 8px 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
            min-width: 160px;
        }

        /* Action Buttons */
        .btn-action-group { display: flex; gap: 10px; flex-wrap: wrap; }
        .btn { border: none; padding: 9px 16px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 14px; display: inline-flex; align-items: center; gap: 6px; }
        .btn-today { background: #0d6efd; color: white; }
        .btn-today:hover { background: #0b5ed7; }
        .btn-excel { background: #1e7e34; color: white; }
        .btn-excel:hover { background: #145523; }
        .btn-print { background: #17a2b8; color: white; }
        .btn-print:hover { background: #117a8b; }
        .btn-reset { background: #6c757d; color: white; }
        .btn-reset:hover { background: #545b62; }
        .btn-danger { background: #e53935; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; }

        /* Record Cards & Tables */
        .record-card { 
            background: white; 
            padding: 25px 20px; 
            border-radius: 12px; 
            margin-bottom: 25px; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.06); 
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        
        /* หัวข้อฟอร์ม */
        .form-title {
            text-align: center;
            font-size: 22px;
            font-weight: 700;
            color: #26364d;
            margin-bottom: 12px;
            letter-spacing: 0.5px;
        }

        .record-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #ed8585; padding-bottom: 8px; margin-bottom: 15px; }

        table { width: 100%; border-collapse: collapse; margin-bottom: 15px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: center; font-size: 14px; }
        th { background: #26364d; color: white; }
        tbody tr:nth-child(even) { background: #f9fbfd; }

        /* ส่วนพื้นที่สรุปยอด + เซ็นอนุมัติ (Signature Section) */
        .signature-container {
            margin-top: 25px;
            padding-top: 15px;
            border-top: 1px dashed #cbd5e1;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .summary-box {
            font-weight: bold;
            background: #f8fafc;
            padding: 8px 15px;
            border-radius: 6px;
            border: 1px solid #e2e8f0;
            width: fit-content;
            font-size: 14px;
        }
        .signature-row {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            gap: 20px;
            margin-top: 15px;
            padding: 0 10px;
        }
        .signature-item {
            flex: 1;
            text-align: center;
            font-size: 13px;
        }
        /* เพิ่มระยะห่าง บน-ล่าง ของบรรทัดจุดไข่ปลาเซ็นชื่อ */
        .sig-line-row {
            white-space: nowrap;
            color: #333;
            margin-top: 20px;
            margin-bottom: 12px;
        }
        .sig-name { 
            color: #444; 
            margin-bottom: 6px;
        }
        .sig-title { 
            font-weight: 600; 
            color: #111; 
        }

        .btn-link {
            background: #ffffff;
            color: #26364d;
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: bold;
            padding: 10px 18px;
            border-radius: 8px;
            border: 1px solid #dcdfe6;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            transition: all 0.2s;
        }
        .btn-link:hover { background: #26364d; color: #ffffff; }

        /* CSS สำหรับการพิมพ์ ออกกระดาษ A4 แนวตั้ง */
        @media print {
            @page { size: A4 portrait; margin: 8mm; }
            body { background: white; padding: 0; color: #000; }
            .no-print, .top-bar, .filter-card, .btn-danger { display: none !important; }
            .container { max-width: 100%; width: 100%; margin: 0; padding: 0; }
            
            .record-card { 
                box-shadow: none; 
                border: none; 
                padding: 0; 
                margin-bottom: 0; 
                min-height: 270mm; 
                display: flex;
                flex-direction: column;
                justify-content: space-between;
                page-break-after: always; 
                break-after: page; 
            }
            .record-card:last-child {
                page-break-after: auto;
                break-after: auto;
            }

            .form-title {
                font-size: 16pt !important;
                margin-bottom: 8px !important;
                color: #000 !important;
            }

            table { page-break-inside: auto; }
            thead { display: table-header-group; }
            tr { page-break-inside: avoid; break-inside: avoid; }

            th { background: #eee !important; color: #000 !important; }
            td, th { border: 1px solid #444 !important; font-size: 9pt; padding: 4px 2px; }
            .record-header h3 { margin: 0 0 10px 0; font-size: 11pt; }
            
            .signature-container {
                margin-top: auto;
                padding-top: 15px;
                border-top: 1px solid #000;
                page-break-inside: avoid;
                break-inside: avoid;
            }
            .summary-box {
                border: 1px solid #000;
                background: none;
                font-size: 9pt;
                padding: 4px 10px;
            }
            .signature-row {
                padding: 0;
                gap: 10px;
                margin-top: 10px;
            }
            .signature-item {
                font-size: 9pt;
            }
            /* เพิ่มระยะห่าง สำหรับงานพิมพ์ */
            .sig-line-row {
                margin-top: 25px !important;
                margin-bottom: 12px !important;
            }
            .sig-name {
                margin-bottom: 6px !important;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <!-- แถบเมนูด้านบน -->
    <div class="top-bar no-print">
        <a href="index.html" class="btn-link">⬅ หน้าหลัก</a>
    </div>

    <h2 style="color:#26364d;" class="no-print">🗄️ ประวัติการบันทึกข้อมูล OT ทั้งหมด</h2>

    <!-- ตัวกรองข้อมูล (Filter) และ ปุ่มจัดการ -->
    <div class="filter-card no-print">
        <div style="display: flex; gap: 12px; flex-wrap: wrap; align-items: flex-end;">
            <div class="filter-group">
                <label for="filterDate">📅 กรองตามวันขอทำ OT:</label>
                <input type="date" id="filterDate" onchange="renderDatabase()">
            </div>
            <div class="filter-group">
                <label for="filterType">👤 แยกประเภทบุคลากร:</label>
                <select id="filterType" onchange="renderDatabase()">
                    <option value="all">-- ทั้งหมด --</option>
                    <option value="พนักงาน">พนักงาน</option>
                    <option value="ผู้รับเหมา">ผู้รับเหมา</option>
                </select>
            </div>
            <div class="filter-group" style="justify-content: flex-end; flex-direction: row; gap: 8px;">
                <button class="btn btn-today" onclick="setTodayFilter()">📅 วันนี้</button>
                <button class="btn btn-reset" onclick="resetFilters()">🔄 ล้างตัวกรอง</button>
            </div>
        </div>

        <div class="btn-action-group">
            <button class="btn btn-excel" onclick="exportToExcel()">📊 Export เป็น Excel</button>
            <button class="btn btn-print" onclick="printReport()">🖨️ พิมพ์เอกสาร (A4)</button>
        </div>
    </div>

    <!-- พื้นที่แสดงรายการตารางข้อมูล -->
    <div id="displayArea"></div>
</div>

<script>
    function renderDatabase() {
        const displayArea = document.getElementById("displayArea");
        const db = JSON.parse(localStorage.getItem("ot_database") || "[]");

        const selectedDate = document.getElementById("filterDate").value;
        const selectedType = document.getElementById("filterType").value;

        if (db.length === 0) {
            displayArea.innerHTML = "<div class='record-card'><h3>ยังไม่มีข้อมูลถูกบันทึก</h3></div>";
            return;
        }

        let html = "";
        let hasData = false;

        db.forEach((batch, bIndex) => {
            let batchWorkDateRaw = batch.rawWorkDate;
            if (!batchWorkDateRaw) {
                const batchDateObj = new Date(batch.id || Date.now());
                batchWorkDateRaw = batchDateObj.getFullYear() + '-' + 
                    String(batchDateObj.getMonth() + 1).padStart(2, '0') + '-' + 
                    String(batchDateObj.getDate()).padStart(2, '0');
            }

            if (selectedDate && batchWorkDateRaw !== selectedDate) {
                return;
            }

            const typesToRender = selectedType === "all" ? ["พนักงาน", "ผู้รับเหมา"] : [selectedType];

            typesToRender.forEach(typeGroup => {
                const groupItems = batch.items.filter(item => item.empType === typeGroup);
                if (groupItems.length === 0) return;

                hasData = true;
                const displayWorkDate = batch.workDate || batchWorkDateRaw;

                html += `
                    <div class="record-card">
                        <div>
                            <!-- หัวกระดาษเอกสาร -->
                            <div class="form-title">ฟอร์มขออนุมัติล่วงเวลา</div>

                            <div class="record-header">
                                <h3>
                                    📅 วันขอทำ OT: <span style="color:#1976d2;">${displayWorkDate}</span>
                                    <span style="background:#e2e8f0; color:#26364d; padding:2px 8px; border-radius:4px; font-size:0.85em; margin-left:8px;">ประเภท: ${typeGroup}</span>
                                    <span style="font-size:0.85em; font-weight:normal; color:#666; margin-left:10px;" class="no-print">(บันทึกเมื่อ: ${batch.dateSaved})</span>
                                </h3>
                                <button class="btn-danger no-print" onclick="deleteBatch(${bIndex})">🗑️ ลบรายการนี้</button>
                            </div>

                            <div style="overflow-x:auto;">
                                <table>
                                    <thead>
                                        <tr>
                                            <th>No.</th>
                                            <th>เลขประจำตัว</th>
                                            <th>ชื่อ - สกุล</th>
                                            <th>แยกประเภท</th>
                                            <th>จุดงาน</th>
                                            <th>เข้า</th>
                                            <th>ออก</th>
                                            <th>งานที่ได้รับมอบหมาย</th>
                                            <th>จุดจอดรถ รับ-ส่ง</th>
                                            <th>หมายเหตุ</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        ${groupItems.map((item, idx) => `
                                            <tr>
                                                <td>${idx + 1}</td>
                                                <td>${item.empId || '-'}</td>
                                                <td style="text-align:left;">${item.empName || '-'}</td>
                                                <td>${item.empType || '-'}</td>
                                                <td>${item.workSite || '-'}</td>
                                                <td>${item.timeIn || '-'}</td>
                                                <td>${item.timeOut || '-'}</td>
                                                <td style="text-align:left;">${item.work || '-'}</td>
                                                <td>${item.busStop || '-'}</td>
                                                <td>${item.remark || '-'}</td>
                                            </tr>
                                        `).join('')}
                                    </tbody>
                                </table>
                            </div>
                        </div>

                        <!-- ส่วนสรุปยอด + ช่องเซ็นอนุมัติ 3 ตำแหน่ง -->
                        <div class="signature-container">
                            <div class="summary-box">
                                สรุปรายการ (${typeGroup}): <span style="font-size: 1.1em; color: #26364d;">${groupItems.length} คน</span>
                            </div>

                            <div class="signature-row">
                                <div class="signature-item">
                                    <div class="sig-line-row">........................................ &nbsp;&nbsp;<b>อนุมัติ</b></div>
                                    <div class="sig-name">( ........................................ )</div>
                                    <div class="sig-title">Forming Manager</div>
                                </div>

                                <div class="signature-item">
                                    <div class="sig-line-row">........................................ &nbsp;&nbsp;<b>อนุมัติ</b></div>
                                    <div class="sig-name">( ........................................ )</div>
                                    <div class="sig-title">Production Plant SSF Manager</div>
                                </div>

                                <div class="signature-item">
                                    <div class="sig-line-row">........................................ &nbsp;&nbsp;<b>อนุมัติ</b></div>
                                    <div class="sig-name">( ........................................ )</div>
                                    <div class="sig-title">Production - Fittings Manager</div>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            });
        });

        if (!hasData) {
            displayArea.innerHTML = "<div class='record-card'><h3>ไม่พบข้อมูลตรงตามเงื่อนไขการค้นหา</h3></div>";
        } else {
            displayArea.innerHTML = html;
        }
    }

    // ฟังก์ชันตั้งค่าช่องกรองวันที่ให้เป็น "วันนี้"
    function setTodayFilter() {
        const today = new Date();
        const yyyy = today.getFullYear();
        const mm = String(today.getMonth() + 1).padStart(2, '0');
        const dd = String(today.getDate()).padStart(2, '0');
        
        document.getElementById("filterDate").value = `${yyyy}-${mm}-${dd}`;
        renderDatabase();
    }

    function printReport() {
        const selectedDate = document.getElementById("filterDate").value;
        if (!selectedDate) {
            alert("⚠️ กรุณาเลือก 'วันขอทำ OT' ที่ต้องการพิมพ์ก่อนนะครับ");
            document.getElementById("filterDate").focus();
            return;
        }
        window.print();
    }

    function resetFilters() {
        document.getElementById("filterDate").value = "";
        document.getElementById("filterType").value = "all";
        renderDatabase();
    }

    function deleteBatch(index) {
        if (!confirm("คุณต้องการลบบันทึกชุดนี้ใช่หรือไม่?")) return;
        const db = JSON.parse(localStorage.getItem("ot_database") || "[]");
        db.splice(index, 1);
        localStorage.setItem("ot_database", JSON.stringify(db));
        renderDatabase();
    }

    function exportToExcel() {
        const db = JSON.parse(localStorage.getItem("ot_database") || "[]");
        const selectedDate = document.getElementById("filterDate").value;
        const selectedType = document.getElementById("filterType").value;

        if (db.length === 0) {
            alert("ไม่มีข้อมูลสำหรับ Export");
            return;
        }

        const excelRows = [];

        db.forEach(batch => {
            let batchWorkDateRaw = batch.rawWorkDate;
            if (!batchWorkDateRaw) {
                const batchDateObj = new Date(batch.id || Date.now());
                batchWorkDateRaw = batchDateObj.getFullYear() + '-' + 
                    String(batchDateObj.getMonth() + 1).padStart(2, '0') + '-' + 
                    String(batchDateObj.getDate()).padStart(2, '0');
            }

            if (selectedDate && batchWorkDateRaw !== selectedDate) return;

            let filteredItems = batch.items;
            if (selectedType !== "all") {
                filteredItems = batch.items.filter(item => item.empType === selectedType);
            }

            filteredItems.forEach((item, index) => {
                excelRows.push({
                    "วันขอทำ OT": batch.workDate || batchWorkDateRaw,
                    "วันที่บันทึก": batch.dateSaved,
                    "ลำดับ": index + 1,
                    "เลขประจำตัว": item.empId,
                    "ชื่อ - สกุล": item.empName,
                    "แยกประเภท": item.empType,
                    "จุดงาน": item.workSite || '-',
                    "เวลาเข้า": item.timeIn,
                    "เวลาออก": item.timeOut,
                    "งานที่ได้รับมอบหมาย": item.work,
                    "จุดจอดรถ รับ-ส่ง": item.busStop,
                    "หมายเหตุ": item.remark
                });
            });
        });

        if (excelRows.length === 0) {
            alert("ไม่พบข้อมูลตามเงื่อนไขที่เลือกเพื่อส่งออก Excel");
            return;
        }

        const worksheet = XLSX.utils.json_to_sheet(excelRows);
        const workbook = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(workbook, worksheet, "รายงาน OT");

        worksheet["!cols"] = [
            { wch: 15 }, { wch: 22 }, { wch: 8 }, { wch: 14 }, 
            { wch: 22 }, { wch: 12 }, { wch: 15 }, { wch: 10 }, 
            { wch: 10 }, { wch: 25 }, { wch: 18 }, { wch: 20 }
        ];

        XLSX.writeFile(workbook, `รายงาน_OT_${selectedDate || 'ทั้งหมด'}.xlsx`);
    }

    renderDatabase();
</script>

</body>
</html>
