<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบบันทึกเวลาทำงาน และ OT</title>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; font-family: 'Sarabun', sans-serif; }
        body { background: #f4f6f9; margin: 0; padding: 20px; color: #222; }
        .container { width: 98%; max-width: 1600px; margin: 0 auto; }

        header { background: #ed8585; color: white; padding: 15px; text-align: center; border-radius: 10px; margin-bottom: 15px; }
        
        .top-bar { display: flex; justify-content: space-between; margin-bottom: 15px; gap: 10px; flex-wrap: wrap; align-items: center; }

        .btn-link {
            background: #ffffff;
            color: #26364d;
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: bold;
            padding: 10px 18px;
            border-radius: 8px;
            border: 1px solid #dcdfe6;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            transition: all 0.2s;
        }
        .btn-link:hover { background: #26364d; color: #ffffff; }

        .card {
            background: white;
            border-radius: 10px;
            padding: 18px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.08);
            margin-bottom: 20px;
        }

        /* แถบควบคุมวันที่และปุ่มกด */
        .controls-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 15px;
            background: #f8fafc;
            padding: 12px 15px;
            border-radius: 8px;
            border: 1px solid #e2e8f0;
        }

        .date-picker-group { display: flex; align-items: center; gap: 10px; }
        .date-picker-group label { font-weight: bold; color: #26364d; font-size: 15px; }
        .date-picker-group input[type="date"] { padding: 8px 12px; border-radius: 6px; border: 1px solid #ccc; font-size: 15px; width: auto; }

        .action-btns { display: flex; gap: 10px; flex-wrap: wrap; }
        button, .btn-print { 
            border: none; 
            padding: 10px 18px; 
            border-radius: 6px; 
            cursor: pointer; 
            font-weight: bold; 
            font-size: 15px; 
            transition: 0.2s; 
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
        .btn-add { background: #1976d2; color: white; }
        .btn-add:hover { background: #115293; }
        .btn-submit { background: #2e7d32; color: white; }
        .btn-submit:hover { background: #1b5e20; }
        
        /* สไตล์ปุ่ม Print ขอ OT ที่เพิ่มใหม่ */
        .btn-print { background: #17a2b8; color: white; }
        .btn-print:hover { background: #117a8b; color: white; }

        .btn-delete { background: #e53935; color: white; padding: 5px 10px; }
        .btn-delete:hover { background: #c62828; }

        .table-wrapper { overflow-x: auto; }
        table { width: 100%; min-width: 1250px; border-collapse: collapse; }
        th, td { border: 1px solid #ccc; padding: 6px; text-align: center; font-size: 14px; }
        th { background: #26364d; color: white; }
        th.sub-head { background: #3a4d68; }

        input, select { width: 100%; padding: 6px; border: 1px solid #aaa; border-radius: 4px; font-size: 14px; }
        input[readonly] { background-color: #f0f0f0; cursor: not-allowed; }

        .summary-box { background: #f8fafc; border: 1px solid #dcdfe6; border-radius: 8px; padding: 15px; width: 300px; margin-top: 15px; }
        .summary-row { display: flex; justify-content: space-between; margin-bottom: 8px; font-weight: bold; }
    </style>
</head>
<body>

<header>
    <h1 style="margin:0;">ระบบบันทึกเวลาทำงาน และ OT</h1>
</header>

<div class="container">
    <div class="top-bar">
        <a href="index.html" class="btn-link">🏠 หน้าหลัก</a>
    </div>

    <div class="card">
        <!-- แถบเลือกวันที่และปุ่มบันทึก -->
        <div class="controls-bar">
            <div class="date-picker-group">
                <label for="recordDate">📅 วันที่ปฏิบัติงาน / ลงเวลา:</label>
                <input type="date" id="recordDate" required>
            </div>
            <div class="action-btns">
                <button class="btn-add" onclick="addRow()">+ เพิ่มแถว</button>
                <button class="btn-submit" onclick="submitData()">💾 บันทึกข้อมูล (Submit)</button>
                <!-- ปุ่ม Print ขอ OT ที่เพิ่มเข้ามา -->
                <a href="บันทึกข้อมูล.html" class="btn-print">🖨️ Print</a>
            </div>
        </div>

        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th rowspan="2" style="width: 50px;">No.</th>
                        <th rowspan="2" style="width: 110px;">เลขประจำตัว</th>
                        <th rowspan="2" style="width: 180px;">ชื่อ - สกุล</th>
                        <th rowspan="2" style="width: 110px;">แยกประเภท</th>
                        <th rowspan="2" style="width: 130px;">จุดงาน</th>
                        <th colspan="2">เวลาเข้าออก</th>
                        <th rowspan="2">งานที่ได้รับมอบหมาย</th>
                        <th rowspan="2" style="width: 160px;">จุดจอดรถ รับ-ส่ง</th>
                        <th rowspan="2">หมายเหตุ</th>
                        <th rowspan="2" style="width: 60px;">ลบ</th>
                    </tr>
                    <tr>
                        <th class="sub-head" style="width: 110px;">เข้า</th>
                        <th class="sub-head" style="width: 110px;">ออก</th>
                    </tr>
                </thead>
                <tbody id="otTableBody"></tbody>
            </table>
        </div>

        <!-- โซนสรุปยอดล่างตาราง -->
        <div class="summary-box">
            <div class="summary-row">
                <span>พนักงาน:</span>
                <span id="cntEmp">0 คน</span>
            </div>
            <div class="summary-row">
                <span>ผู้รับเหมา:</span>
                <span id="cntContractor">0 คน</span>
            </div>
            <hr style="border: 0.5px solid #ccc;">
            <div class="summary-row" style="color: #d32f2f; font-size: 1.1em;">
                <span>รวม:</span>
                <span id="cntTotal">0 คน</span>
            </div>
        </div>
    </div>
</div>

<script>
    // ตั้งค่า วันที่ปัจจุบัน ในช่องเลือกวันที่
    document.getElementById('recordDate').valueAsDate = new Date();

    // ดึงข้อมูล Master จาก LocalStorage
    let persons = JSON.parse(localStorage.getItem('master_persons')) || [
        { id: '1234', name: 'สมชาย ใจดี', type: 'พนักงาน', workSite: 'ไลน์ผลิต A' },
        { id: '1235', name: 'สมศรี มีตา', type: 'ผู้รับเหมา', workSite: 'คลังสินค้า' }
    ];
    let busStops = JSON.parse(localStorage.getItem('master_bus_stops')) || ['หน้าโรงงาน', 'ตลาดสด', 'สี่แยก'];

    // สร้าง ตัวเลือกเวลาสำหรับ Dropdown (ทุกๆ 30 นาที)
    function generateTimeOptions() {
        let options = `<option value="">-- เลือก --</option>`;
        for (let h = 0; h < 24; h++) {
            for (let m of ['00', '30']) {
                let hh = h < 10 ? '0' + h : h;
                let timeStr = `${hh}:${m}`;
                options += `<option value="${timeStr}">${timeStr}</option>`;
            }
        }
        return options;
    }

    const timeOptionsHTML = generateTimeOptions();

    function addRow() {
        const tbody = document.getElementById("otTableBody");
        const rowCount = tbody.children.length + 1;
        const tr = document.createElement("tr");

        // สร้าง ตัวเลือกชื่อพนักงาน
        let personOptions = `<option value="">-- เลือกบุคคล --</option>`;
        persons.forEach(p => {
            personOptions += `<option value="${p.id}" data-name="${p.name}" data-type="${p.type}" data-worksite="${p.workSite || ''}">${p.id} - ${p.name}</option>`;
        });

        // สร้าง ตัวเลือกจุดจอดรถ
        let busOptions = `<option value="">-- เลือกจุดจอด --</option>`;
        busStops.forEach(b => {
            busOptions += `<option value="${b}">${b}</option>`;
        });

        tr.innerHTML = `
            <td class="row-no">${rowCount}</td>
            <td><input type="text" class="emp-id" readonly></td>
            <td>
                <select class="emp-select" onchange="onPersonChange(this)">
                    ${personOptions}
                </select>
            </td>
            <td><input type="text" class="emp-type" readonly></td>
            <td><input type="text" class="work-site" readonly placeholder="-"></td>
            <td>
                <select class="time-in">
                    ${timeOptionsHTML}
                </select>
            </td>
            <td>
                <select class="time-out">
                    ${timeOptionsHTML}
                </select>
            </td>
            <td><input type="text" class="work-detail" placeholder="ระบุงาน"></td>
            <td>
                <select class="bus-stop">
                    ${busOptions}
                </select>
            </td>
            <td><input type="text" class="remark"></td>
            <td><button class="btn-delete" onclick="deleteRow(this)">ลบ</button></td>
        `;

        tbody.appendChild(tr);
        updateSummary();
    }

    function onPersonChange(selectEl) {
        const row = selectEl.closest("tr");
        const selectedOpt = selectEl.options[selectEl.selectedIndex];

        if (selectEl.value) {
            row.querySelector(".emp-id").value = selectEl.value;
            row.querySelector(".emp-type").value = selectedOpt.getAttribute("data-type") || "";
            row.querySelector(".work-site").value = selectedOpt.getAttribute("data-worksite") || "-";
        } else {
            row.querySelector(".emp-id").value = "";
            row.querySelector(".emp-type").value = "";
            row.querySelector(".work-site").value = "";
        }
        updateSummary();
    }

    function deleteRow(btn) {
        btn.closest("tr").remove();
        reIndexRows();
        updateSummary();
    }

    function reIndexRows() {
        const rows = document.querySelectorAll("#otTableBody tr");
        rows.forEach((row, index) => {
            row.querySelector(".row-no").textContent = index + 1;
        });
    }

    function updateSummary() {
        const types = document.querySelectorAll(".emp-type");
        let empCount = 0;
        let contractorCount = 0;

        types.forEach(input => {
            if (input.value === "พนักงาน") empCount++;
            if (input.value === "ผู้รับเหมา") contractorCount++;
        });

        document.getElementById("cntEmp").textContent = empCount + " คน";
        document.getElementById("cntContractor").textContent = contractorCount + " คน";
        document.getElementById("cntTotal").textContent = (empCount + contractorCount) + " คน";
    }

    function submitData() {
        const recordDate = document.getElementById("recordDate").value;
        if (!recordDate) {
            alert("กรุณาเลือกวันที่บันทึก/ปฏิบัติงาน");
            return;
        }

        const rows = document.querySelectorAll("#otTableBody tr");
        if (rows.length === 0) {
            alert("กรุณาเพิ่มข้อมูลอย่างน้อย 1 รายการ");
            return;
        }

        const items = [];
        let hasEmptyPerson = false;

        rows.forEach(row => {
            const empSelect = row.querySelector(".emp-select");
            const empId = row.querySelector(".emp-id").value;
            
            if (!empId) {
                hasEmptyPerson = true;
            }

            const empName = empSelect.options[empSelect.selectedIndex]?.getAttribute("data-name") || "";

            items.push({
                no: row.querySelector(".row-no").textContent,
                empId: empId,
                empName: empName,
                empType: row.querySelector(".emp-type").value,
                workSite: row.querySelector(".work-site").value,
                timeIn: row.querySelector(".time-in").value,
                timeOut: row.querySelector(".time-out").value,
                work: row.querySelector(".work-detail").value,
                busStop: row.querySelector(".bus-stop").value,
                remark: row.querySelector(".remark").value
            });
        });

        if (hasEmptyPerson) {
            if (!confirm("มีบางแถวยังไม่ได้เลือกบุคคล คุณต้องการบันทึกต่อหรือไม่?")) {
                return;
            }
        }

        const [y, m, d] = recordDate.split('-');
        const formattedDate = `${d}/${m}/${parseInt(y) + 543}`;

        const recordBatch = {
            id: Date.now(),
            workDate: formattedDate,
            rawWorkDate: recordDate,
            dateSaved: new Date().toLocaleString("th-TH"),
            cntEmp: document.getElementById("cntEmp").textContent,
            cntContractor: document.getElementById("cntContractor").textContent,
            cntTotal: document.getElementById("cntTotal").textContent,
            items: items
        };

        const existingRecords = JSON.parse(localStorage.getItem("ot_database") || "[]");
        existingRecords.push(recordBatch);
        localStorage.setItem("ot_database", JSON.stringify(existingRecords));

        // แจ้งเตือนเมื่อบันทึกสำเร็จ (ยังคงอยู่หน้าเดิม ไม่ทำการ Redirect)
        alert(`บันทึกข้อมูลประจำเป็นวันที่ ${formattedDate} เรียบร้อยแล้ว!`);
    }

    // เริ่มต้นสร้าง 3 แถว
    addRow();
    addRow();
    addRow();
</script>

</body>
</html>
